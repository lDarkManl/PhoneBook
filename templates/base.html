<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PhoneBook{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .navbar {
            background-color: #1e5a8e;
            padding: 15px 0;
        }
        .navbar .home-icon {
            background-color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e5a8e;
            font-size: 1.5rem;
        }
        .nav-pills .nav-link {
            background-color: white;
            color: black;
            border-radius: 25px;
            padding: 12px 35px;
            margin: 0 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .nav-pills .nav-link:hover {
            background-color: #e8f4f8;
        }
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(0, 0, 0, 0.55)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }
        @media (max-width: 991px) {
            .nav-pills {
                flex-direction: column;
                align-items: flex-start;
                margin-top: 15px;
            }
            .nav-pills .nav-link {
                margin: 5px 0;
                width: 100%;
            }
        }
        main {
            flex: 1;
            background-color: white;
        }
        footer {
            background-color: #2b5a8e;
            padding: 15px 0;
            text-align: center;
            color: white;
            margin-top: auto;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a href="{% url 'home' %}" class="home-icon">
                <i class="bi bi-house-fill"></i>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="background-color: white; border: none;">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="nav nav-pills ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'employee_list' %}">СОТРУДНИКИ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'subdivision_list' %}">ПОДРАЗДЕЛЕНИЯ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'room_schedule' %}">АУДИТОРИИ</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% if messages %}
            <div class="container mt-3">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p class="mb-0">© 2025</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
